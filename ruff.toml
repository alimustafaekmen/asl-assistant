target-version = "py312"
line-length = 100

# Ruff already skips what .gitignore lists. These two are excluded even
# without Git metadata (a ZIP download): a local environment such as
# .venv-desktop, and the notebooks, which are recorded training runs rather
# than maintained source.
extend-exclude = [
  ".venv*",
  "notebooks",
]

[format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[lint]
# Correctness errors and import order only. Style rules would churn the
# desktop and training code without changing what it does.
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# The scripts put the local src folders on sys.path before they import the
# packages there. The desktop app sets the CustomTkinter theme before it
# imports the views that build widgets.
"asl-desktop/src/asl_desktop/app/asl_app.py" = ["E402"]
"scripts/data_preparation/extract_static_letter_landmarks.py" = ["E402"]
"scripts/data_preparation/merge_static_letter_datasets.py" = ["E402"]
"scripts/model_training/train_dynamic_jz_model.py" = ["E402"]
"scripts/model_training/train_static_letter_model.py" = ["E402"]
