[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-features"
version = "0.1.0"
description = "Shared Python feature code for ASL Assistant: landmark normalization and the letter and word model features"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Ali Mustafa Ekmen" },
]

# Runtime dependencies (asl-web does NOT use this package)
dependencies = [
  "numpy>=1.26,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["asl_features*"]
