[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-desktop"
version = "0.1.0"
description = "Legacy desktop CustomTkinter prototype for ASL Assistant. Active product is `asl-web/`."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Ali Mustafa Ekmen" },
]

dependencies = [
  "numpy>=1.26,<2",
  "opencv-contrib-python>=4.5,<5",
  "pillow>=11,<12",
  "mediapipe>=0.10.18,<0.11",
  "scikit-learn>=1.8,<2",
  "lightgbm>=4.6,<5",
  "joblib>=1.5,<2",
  "torch>=2.2,<3",
  "customtkinter>=6,<7",
  "pyttsx3>=2.99,<3",
  "asl-ml==0.1.0",  # Sibling package; `make setup` installs it first.
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["asl_desktop*"]
