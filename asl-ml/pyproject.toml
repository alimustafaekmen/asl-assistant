[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-ml"
version = "0.1.0"
description = "Shared Python ML/data utilities for ASL Assistant (letter feature engineering, landmark normalization, label-map I/O)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Ali Mustafa Ekmen" },
]

# Runtime dependencies (asl-web does NOT use this package)
dependencies = [
  "numpy>=1.26,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["asl_ml*"]

[tool.setuptools.package-data]
"asl_ml" = ["py.typed"]
